<svg xmlns="http://www.w3.org/2000/svg" width="430" height="220" viewBox="0 0 430 220" role="img" aria-labelledby="t d">
<title id="t">Vehicle Security + ETL</title><desc id="d">Vehicle Security + ETL: 99.7% attack detection. 1000+ CAN messages a second, anomalies flagged in under 100 ms. Built with Python · Kafka · MongoDB · scikit-learn.</desc>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #e6edf3; }
  .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
  .muted { fill: #8b98a9; }
  .gold { fill: #C9A84C; }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pop { 0% { opacity: 0; transform: translateY(12px) scale(.96); } 60% { opacity: 1; transform: translateY(-2px) scale(1.02); } 100% { opacity: 1; transform: none; } }
  .a { animation: rise .7s 0.12s cubic-bezier(.2,.7,.2,1) both; }
  .big { font-size: 40px; font-weight: 700; letter-spacing: -1px; fill: #C9A84C; animation: pop .8s 0.32s both; }
  .bar { transform-box: fill-box; transform-origin: left; animation: draw .9s 0.42s cubic-bezier(.2,.7,.2,1) both; }
  .name { font-size: 15px; font-weight: 600; } .lab { font-size: 12.5px; } .txt { font-size: 13px; } .stk { font-size: 11.5px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="429" height="219" rx="14" fill="#0d1117" stroke="#263041"/>
<g class="a"><text class="name" x="28" y="38">Vehicle Security + ETL</text></g>
<text class="big" x="28" y="92">99.7%</text>
<text class="lab muted a" x="28" y="112">attack detection</text>
<rect class="bar" x="28" y="124" width="48" height="3" rx="1.5" fill="#C9A84C"/>
<g class="a"><text class="txt" x="28" y="150">1000+ CAN messages a second, anomalies flagged in</text><text class="txt" x="28" y="168">under 100 ms.</text></g>
<text class="stk mono muted a" x="28" y="198">Python · Kafka · MongoDB · scikit-learn</text>
